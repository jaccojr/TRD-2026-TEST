name: Fetch weather (offset test, production-style)

# Mirrors PROD's real workflow exactly: no date-shifting step, real fixed dates baked
# into data.js, offset backward just far enough to stay inside Open-Meteo's forecast
# horizon. The point is to test the actual pipeline PROD will run, not the rolling
# TEST-only shift_dates.py mechanism, which this run does NOT use.
#
# Runs hourly. This was workflow_dispatch-only at first, deliberately, because TEST
# briefly had a second, separate rolling workflow (shift_dates.py-based) also running
# hourly, and manual-only avoided the two colliding. That other workflow no longer
# exists in this repo, so there's nothing left for an hourly schedule to conflict with.

on:
  schedule:
    - cron: "0 * * * *"   # hourly
  workflow_dispatch: {}   # still available for an on-demand run too

permissions:
  contents: write

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python fetch_weather.py
      - run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add weather.json
          git commit -m "offset test: weather update" || echo "no changes"
          git pull --rebase --autostash origin main || true
          git push
