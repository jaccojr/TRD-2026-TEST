name: Fetch weather (offset test, production-style)

# One-time verification run, not the ongoing TEST mechanism. This deliberately mirrors
# PROD's real workflow exactly, no date-shifting step, real fixed dates baked into data.js,
# just offset 28 days earlier so they're still inside Open-Meteo's forecast horizon right
# now. The point is to test the actual pipeline PROD will run, not the rolling TEST-only
# shift_dates.py mechanism, which this run does NOT use.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python fetch_weather.py
      - run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add weather.json
          git commit -m "offset test: weather update" || echo "no changes"
          git pull --rebase --autostash origin main || true
          git push
